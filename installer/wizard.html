<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varu installer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b5d4b' d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E">
<script>
// Before the page draws: the theme chosen on this device, as in the viewer
// (viewer/js/theme.js). Light or dark; anything else follows the device.
(function () {
  var theme = (document.cookie.match(/(?:^|; )varu_theme=([^;]*)/) || [])[1];
  if (theme === undefined) {
    try { theme = localStorage.getItem("varu.theme"); } catch (e) { /* private mode */ }
  }
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
})();
</script>
<style>
/* The viewer's "Varu 2026" tokens (viewer/css/app.css). */
:root {
  --bg: #f3f0e8; --surface: #fffdf8; --surface-alt: #eae6dc; --ink: #1b2420; --muted: #56625c;
  --subtle: #7a847f; --line: #d9d4c7; --accent: #0b5d4b; --accent-soft: #e2efea; --accent-ink: #ffffff;
  --alert: #b3261e; --alert-soft: #fcebe8; --alert-ink: #ffffff; --warn: #8a5300; --warn-soft: #fdf1da;
  --radius: 10px; --wrap: min(100% - 64px, 936px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1a211e; --surface-alt: #232c28; --ink: #e9e6dd; --muted: #a3aea8;
    --subtle: #7f8a84; --line: #2c3632; --accent: #74d3b6; --accent-soft: #173029; --accent-ink: #0d1512;
    --alert: #ff8a80; --alert-soft: #3a1a17; --alert-ink: #1a0b0a; --warn: #f3b34c; --warn-soft: #3a2a10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a211e; --surface-alt: #232c28; --ink: #e9e6dd; --muted: #a3aea8;
  --subtle: #7f8a84; --line: #2c3632; --accent: #74d3b6; --accent-soft: #173029; --accent-ink: #0d1512;
  --alert: #ff8a80; --alert-soft: #3a1a17; --alert-ink: #1a0b0a; --warn: #f3b34c; --warn-soft: #3a2a10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
main { flex: 1; width: var(--wrap); margin: 0 auto; padding: 28px 0 40px; }
h1, h2 { margin: 0; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
p { margin: 0; }
.hint { color: var(--muted); }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar { width: var(--wrap); margin: 0 auto; }
.narrow { display: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { padding: 10px 22px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:disabled { opacity: 0.45; }
.btn.danger { background: var(--alert); border-color: var(--alert); color: var(--alert-ink); font-weight: 700; }

/* Top bar */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: #0b5d4b; color: #f3f0e8; }
.logo .i { width: 22px; height: 22px; }
.brand strong { font-size: 19px; font-weight: 750; letter-spacing: -0.02em; }
.brand .sub { padding-left: 10px; border-left: 1px solid var(--line); color: var(--muted); font-weight: 500; line-height: 18px; }
.bar-end { display: flex; align-items: center; gap: 10px; }
.langs, .theme-switch { display: flex; padding: 3px; border-radius: 8px; background: var(--surface-alt); }
.langs button { padding: 4px 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }
.theme-switch button, .theme-toggle {
  display: grid; place-items: center; width: 30px; height: 24px; padding: 0;
  border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted);
}
.theme-switch .i { width: 15px; height: 15px; }
.theme-switch button[aria-pressed="true"] { background: var(--surface); border-color: var(--line); color: var(--accent); box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }
.theme-toggle { display: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-alt); color: var(--ink); }

/* The four steps */
.stepper { background: var(--surface); border-bottom: 1px solid var(--line); }
.stepper .bar { padding: 16px 0; }
.steps { display: flex; align-items: center; gap: 12px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; flex: 1; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.steps li:first-child { flex: none; }
.steps li:not(:first-child)::before { content: ""; flex: 1; height: 2px; margin-right: 4px; border-radius: 1px; background: var(--line); }
.steps .dot {
  display: grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 50%;
  background: var(--surface-alt); color: var(--muted); font-size: 12px; font-weight: 700;
}
.steps .dot .i { width: 14px; height: 14px; }
.steps [data-state="done"], .steps [data-state="now"] { color: var(--ink); }
.steps [data-state="now"] { font-weight: 650; }
.steps [data-state="done"]::before, .steps [data-state="now"]::before { background: var(--accent) !important; }
.steps [data-state="done"] .dot, .steps [data-state="now"] .dot { background: var(--accent); color: var(--accent-ink); }
.bars, .step-now { display: none; }

/* Setup: the step on the left, "Your Varu" on the right */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; gap: 28px; }
.setup.last { grid-template-columns: minmax(0, 1fr); }
.setup.last .summary { display: none; }
.step { display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-direction: column; gap: 6px; }
.intro { display: flex; gap: 12px; padding: 16px; border-radius: 12px; background: var(--accent-soft); font-size: 15px; }
.intro .i { width: 20px; height: 20px; margin-top: 2px; color: var(--accent); }

.choices { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.choices.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
/* A chosen place to go, or a book (gigabytes), stands out; the small place layers do not. */
#targets .card:has(input:checked), #library .card:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card.waiting { opacity: 0.6; }
.card:has(.format.confirm) { border-color: var(--alert); box-shadow: inset 0 0 0 1px var(--alert); }
.choice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
.choices.grid2 .choice { padding: 10px 14px; }
.choice input[type=radio], .choice input[type=checkbox] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }
.choice > .i { width: 18px; height: 18px; color: var(--muted); }
.card:has(input:checked) .choice > .i { color: var(--accent); }
.choice .grow { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.choice strong { font-size: 16px; font-weight: 650; }
.choice .grow input[type=text] {
  flex-basis: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px;
}
.tag { padding: 1px 7px; border-radius: 5px; background: var(--surface-alt); color: var(--muted); font-size: 12px; font-weight: 600; }
.size { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dot-color { width: 10px; height: 10px; flex: none; border-radius: 50%; }
.format { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 16px 16px; padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); }
.format > .i { color: var(--warn); }
.format p { flex: 1; min-width: 12rem; }
.format.confirm { align-items: flex-start; background: var(--alert-soft); }
.format.confirm > .i { margin-top: 3px; color: var(--alert); }
.format.done { background: var(--accent-soft); }
.format.done > .i { color: var(--accent); }
.format.failed { background: var(--alert-soft); color: var(--alert); }
.format .row { display: flex; gap: 8px; flex-basis: 100%; padding-left: 30px; }

.field { display: flex; flex-direction: column; gap: 8px; font-weight: 650; }
.select { position: relative; display: block; }
.select select {
  appearance: none; width: 100%; height: 44px; padding: 0 40px 0 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 400;
}
.select .i { position: absolute; top: 13px; right: 14px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.select select:disabled { opacity: 1; }
.search-row { display: flex; gap: 8px; }
.search-row .btn { height: 44px; }
.search-row .btn .i { color: var(--accent); }
.search-box {
  display: flex; flex: 1; align-items: center; gap: 10px; height: 44px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.search-box:focus-within { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.search-box .i { width: 17px; height: 17px; color: var(--muted); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }
.results { display: flex; flex-direction: column; gap: 6px; margin: -8px 0 0; padding: 0; list-style: none; }
.results:empty { display: none; }
.results .btn { justify-content: flex-start; width: 100%; font-weight: 500; text-align: left; }
.home-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); font-weight: 600; }
.home-box .i { width: 18px; height: 18px; color: var(--accent); }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface-alt); }
.seg button { flex: 1; padding: 9px 4px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }

/* "Your Varu" and the size */
.summary { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.summary h2 { font-size: 15px; font-weight: 700; }
.facts { display: flex; flex-direction: column; gap: 14px; margin: 0; }
.facts div { display: flex; gap: 10px; }
.facts .i { margin-top: 2px; color: var(--accent); }
.facts dt { color: var(--muted); font-size: 12px; }
.facts dd { margin: 0; font-weight: 600; }
.facts .unset .i { color: var(--muted); }
.facts .unset dd { color: var(--muted); }
.summary hr { width: 100%; margin: 0; border: 0; border-top: 1px solid var(--line); }
.size-part { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 13px; }
.size-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.size-top strong { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.size-top .over { color: var(--alert); }
.track { height: 8px; overflow: hidden; border-radius: 4px; background: var(--surface-alt); }
.track span { display: block; height: 100%; min-width: 4px; border-radius: 4px; background: var(--accent); }
.track.over span { background: var(--alert); }

/* Step 4 */
.path { color: var(--muted); }
.box { display: flex; gap: 12px; padding: 14px 16px; border-radius: 10px; }
.box > .i { width: 18px; height: 18px; margin-top: 2px; }
.box ul { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.box.bad { background: var(--alert-soft); border: 1px solid var(--alert); }
.box.bad > .i, .box.bad li:first-child { color: var(--alert); }
.box.bad li:first-child { font-weight: 650; }
.box.warn { background: var(--warn-soft); }
.box.warn > .i { color: var(--warn); }
.box.soft { background: var(--accent-soft); }
.box.soft > .i { color: var(--accent); }
.review { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.review div { display: grid; grid-template-columns: 18px 150px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 18px; }
.review div + div { border-top: 1px solid var(--line); }
.review .i { color: var(--accent); }
.review dt { color: var(--muted); }
.review dd { margin: 0; font-weight: 650; }
.link { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
.size-box { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); }
.size-box .size-top strong { font-size: 15px; }

/* Footer: Back and Next */
.foot { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-top: 1px solid var(--line); }
.foot .bar { display: flex; align-items: center; gap: 10px; padding: 14px 0; }
.foot #next, .foot #install { margin-left: auto; }
.mini { display: none; }

/* Installing, finished, and the screens that stand in for the wizard */
.after { display: flex; flex-direction: column; gap: 20px; max-width: 640px; margin: 24px auto 0; }
.after .track { height: 10px; }
.progress-line { display: flex; justify-content: space-between; gap: 16px; margin-top: -10px; }
.progress-line span { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.parts { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 16px 18px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); }
.parts li { display: flex; align-items: center; gap: 10px; }
.parts .mark { display: grid; place-items: center; width: 20px; height: 20px; flex: none; border: 1.5px solid var(--line); border-radius: 50%; }
.parts .mark .i { width: 12px; height: 12px; stroke-width: 3; }
.parts [data-state="done"] { color: var(--ink); }
.parts [data-state="done"] .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.parts [data-state="now"] { color: var(--ink); font-weight: 650; }
.parts [data-state="now"] .mark { border: 2px solid var(--accent); }
.parts [data-state="now"] .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.keep { display: flex; gap: 10px; color: var(--muted); }
.keep .i { margin-top: 3px; }
.done-head { display: flex; align-items: center; gap: 16px; }
.done-head h1 { font-size: 28px; }
.done-icon { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.done-icon.problems { background: var(--warn-soft); color: var(--warn); }
.done-icon .i { width: 24px; height: 24px; }
#errors li { display: flex; gap: 8px; align-items: flex-start; }
#errors .i { margin-top: 3px; }
#errors li:last-child { color: var(--ink); font-weight: 400; }
.os-files { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.os-files div { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 10px 16px; }
.os-files div + div { border-top: 1px solid var(--line); }
.os-files dt { color: var(--muted); }
.os-files dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.message { align-items: center; max-width: 520px; margin-top: 12vh; text-align: center; }
.message .done-icon { background: var(--alert-soft); color: var(--alert); }
.message code { width: 100%; padding: 10px 14px; border-radius: 8px; background: var(--surface-alt); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.center { text-align: center; margin-top: 12vh; }

@media (max-width: 719px) {
  :root { --wrap: calc(100% - 40px); }
  .wide { display: none; }
  .narrow { display: inline; }
  .topbar .bar { height: 56px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; }
  .logo .i { width: 19px; height: 19px; }
  .brand { gap: 9px; }
  .brand strong { font-size: 18px; }
  .bar-end { gap: 8px; }
  .langs button { padding: 3px 8px; font-size: 12px; }
  .theme-switch { display: none; }
  .theme-toggle { display: grid; }
  .theme-toggle .i { width: 16px; height: 16px; }
  .stepper .bar { padding: 4px 0 14px; }
  .steps { display: none; }
  .bars { display: flex; gap: 4px; margin-bottom: 8px; }
  .bars span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .bars span.on { background: var(--accent); }
  .step-now { display: block; color: var(--muted); font-size: 13px; }
  .step-now strong { color: var(--ink); font-weight: 650; }
  main { padding: 24px 0 28px; }
  h1 { font-size: 24px; }
  .setup { display: block; }
  .summary { display: none; }
  .intro { padding: 14px; }
  .choices.grid2 { grid-template-columns: 1fr; }
  .card { border-radius: 12px; }
  .choice { padding: 16px; }
  .choice .grow { flex-direction: column; align-items: flex-start; gap: 2px; }
  .choice .grow small { color: var(--muted); font-size: 13px; }
  .search-row { flex-wrap: wrap; }
  .search-box { flex-basis: calc(100% - 80px); }
  #locate { flex-basis: 100%; }
  .seg { flex-wrap: wrap; gap: 8px; padding: 0; background: none; }
  .seg button { flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .path { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; overflow-wrap: anywhere; }
  .review div { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "icon label change" "icon value change"; gap: 0 12px; padding: 10px 12px; }
  .review .i { grid-area: icon; }
  .review dt { grid-area: label; font-size: 11px; }
  .review dd { grid-area: value; }
  .review .link { grid-area: change; }
  .foot .bar { flex-wrap: wrap; padding: 12px 0 max(env(safe-area-inset-bottom), 20px); }
  .foot .btn { height: 50px; font-size: 16px; }
  .foot #back { flex: 0 0 30%; }
  .foot #next, .foot #install { flex: 1; margin-left: 0; }
  .mini { display: flex; flex-basis: 100%; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .mini .track { flex: 1; height: 6px; }
  .after { margin-top: 0; }
  .message { margin-top: 18vh; }
  .done-phone .done-head { flex-direction: column; text-align: center; margin-top: 14vh; }
  .done-phone #done-text { text-align: center; color: var(--muted); }
  .done-phone .actions { flex-direction: column; margin-top: auto; }
  .done-phone .actions .btn { width: 100%; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="bar">
    <div class="brand">
      <span class="logo"><svg data-icon="pin"></svg></span>
      <strong class="wide">Varu</strong><span class="sub wide" data-t="installer"></span>
      <strong class="narrow" data-t="title"></strong>
    </div>
    <div class="bar-end">
      <div class="langs" role="group">
        <button type="button" data-lang="et">ET</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="theme-switch" role="group" data-tl="theme">
        <button type="button" data-theme-choice="system" data-tl="themeSystem"><svg data-icon="monitor"></svg></button>
        <button type="button" data-theme-choice="light" data-tl="themeLight"><svg data-icon="sun"></svg></button>
        <button type="button" data-theme-choice="dark" data-tl="themeDark"><svg data-icon="moon"></svg></button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </div>
  </div>
</header>

<nav class="stepper" id="stepper" hidden>
  <div class="bar">
    <ol class="steps" id="steps"></ol>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <p class="step-now"><span id="step-count"></span> <strong id="step-name"></strong></p>
  </div>
</nav>

<main>
  <section id="notice" class="after message" hidden>
    <span class="done-icon"><svg data-icon="wifi-off"></svg></span>
    <h1 id="notice-title"></h1>

</main>

function renderStepper() {

    const li = el("li", {}, el("span", { className: "dot" }, state === "done" ? icon("check") : String(n)), t(key));
    li.dataset.state = state;

  }));
  $("bars").replaceChildren(...STEPS.map((_, i) => el("span", { className: i < s.step ? "on" : "" })));
  $("step-count").textContent = t("stepOf", { n: s.step, total: STEPS.length });

function renderStep() {
  document.querySelectorAll("#setup .step").forEach((d) => { d.hidden = Number(d.dataset.step) !== s.step; });
  $("setup").classList.toggle("last", s.step === STEPS.length);
  renderStepper();

  $("next").hidden = s.step === STEPS.length;
  $("install").hidden = s.step !== STEPS.length;
  // A place to put it first; a home whenever the map is cut around one.
  $("next").disabled = s.step === 1 ? !targetPath() || notPortable(s.target) || !!s.formatting : s.step === 2 && s.radius > 0 && !s.home;
}
function goStep(n) {
  s.step = Math.min(Math.max(n, 1), STEPS.length);

function request() {
  return {
    target: targetPath(), region: s.region.id, home: s.home, radius_km: s.radius,
    pois: [...s.pois], library: [...s.library],
  };
}

let planTimer = 0, planSeq = 0;
function replan() {
  clearTimeout(planTimer);
  s.planning = true; renderSummary();
  planTimer = setTimeout(async () => {
    const seq = ++planSeq;
    if (!targetPath()) { s.plan = null; s.planning = false; renderSummary(); return; }
    try {
      const plan = await api("/api/plan", request());
      if (seq === planSeq) s.plan = plan;
    } catch (err) {
      if (seq === planSeq) s.plan = { items: [], problems: [{ code: "", detail: err.message }], warnings: [], needed: 0, free: 0 };
    }
    if (seq === planSeq) { s.planning = false; renderSummary(); }
  }, 400);
}

    const found = await api(`/api/geocode?${new URLSearchParams({ q, country: s.region.country_code ?? "" })}`);
    $("results").replaceChildren(...(found.length ? found.map((place) => {
      const b = el("button", { type: "button", className: "btn", textContent: place.name });
      b.addEventListener("click", () => setHome(place));
      return el("li", {}, b);
    }) : [el("li", { className: "hint", textContent: t("noResults") })]));
  } catch (err) {
    $("results").replaceChildren(el("li", { className: "hint", textContent: err.message }));
  }
});

$("locate").addEventListener("click", () => {
  const say = (key) => $("results").replaceChildren(el("li", { className: "hint", textContent: t(key) }));
  if (!navigator.geolocation) { say("locateFailed"); return; }
  say("locating");
  navigator.geolocation.getCurrentPosition(
    (pos) => setHome({ lat: pos.coords.latitude, lon: pos.coords.longitude, name: t("myLocation") }),
    () => say("locateFailed"),
    { timeout: 10000, maximumAge: 600000 },
  );
});

// Updating a drive (the app found its data older than itself): its earlier
// choices, straight to the last step.
function prefill(u) {
  if (s.state.regions.some((r) => r.id === u.region)) chooseRegion(u.region);
  s.home = u.home ?? null;
  s.radius = u.home ? u.radius_km : 0;
  // Layers new since that install come too: those it was not offered, or
  // (for installs that did not record it) the ones on by default.
  const offered = u.offered && new Set(u.offered);
  const added = (s.region.pois ?? []).filter((p) => (offered ? !offered.has(p.id) : p.default)).map((p) => p.id);
  s.pois = new Set([...u.pois, ...added]);
  s.library = new Set(u.library);
  if (s.state.volumes.some((v) => v.path === u.target)) s.target = u.target;
  else { s.target = "computer"; s.computerPath = u.target; }
  $("update-note").hidden = false;
  goStep(STEPS.length);
}

function setHome(place) {
  s.home = { lat: place.lat, lon: place.lon, name: place.name };
  if (!s.radius) s.radius = 50;
  $("results").replaceChildren();
  renderHome(); replan();
}

$("region").addEventListener("change", () => { chooseRegion($("region").value); renderAll(); replan(); });

$("install").addEventListener("click", async () => {
  $("install").disabled = true;
  try {
    await api("/api/install", request());
    s.installing = true;
    showProgress();
  } catch (err) {
    $("problems").replaceChildren(el("li", { textContent: err.message }));
    $("problems-box").hidden = false;
    $("install").disabled = false;
  }
});

function showProgress() {
  $("setup").hidden = $("stepper").hidden = $("foot").hidden = true;
  $("progress").hidden = false;
  window.scrollTo(0, 0);
}

const what = (it, fallback = "") => !it ? fallback : it.kind === "book" ? t("step_book", { title: it.title }) : t(it.cut ? "step_cut" : `step_${it.kind}`);
const targetName = (path) => s.state?.volumes.find((v) => v.path === path)?.label ?? t("computer");

function renderJob(job) {
  if (!job) return;
  s.job = job;
  if (!job.finished) {
    if ($("progress").hidden) showProgress();
    s.installing = true;
    window.VaruAndroid?.downloading?.(); // keeps going with the screen off
    $("progress-to").textContent = t("installingTo", { where: `${targetName(job.target)} (${job.target})` });
    $("bar").setAttribute("aria-valuemax", job.total || 1);
    $("bar").setAttribute("aria-valuenow", job.done);
    $("bar").firstElementChild.style.width = `${(100 * job.done) / (job.total || 1)}%`;
    $("current").textContent = what(job.current);
    $("amount").textContent = t("of", { done: size(job.done), total: size(job.total) });
    // Parts before the running one are done; it runs them in order.
    const items = job.items ?? [];
    const now = items.findIndex((it) => it.kind === job.current?.kind && it.title === job.current?.title);
    $("parts").replaceChildren(...items.map((it, i) => {
      const li = el("li", {}, el("span", { className: "mark" }, i < now ? icon("check") : null), what(it));
      li.dataset.state = i < now ? "done" : i === now ? "now" : "next";
      return li;
    }));
    return;
  }
  s.installing = false;
  $("setup").hidden = $("stepper").hidden = $("foot").hidden = $("progress").hidden = true;
  $("done").hidden = false;
  const problems = job.errors.length > 0;
  $("done-icon").className = `done-icon${problems ? " problems" : ""}`;
  $("done-icon").replaceChildren(icon(problems ? "triangle-alert" : "check"));
  $("done-title").textContent = t(problems ? "doneProblems" : "doneTitle");
  $("errors-box").hidden = !problems;
  $("errors").replaceChildren(...job.errors.map((text) => el("li", {}, icon("x"), text)),
    ...(problems ? [el("li", {}, icon("refresh-cw"), t("retryLater"))] : []));
  const phone = !!s.state?.phone;
  $("done").classList.toggle("done-phone", phone);
  $("done-usb").hidden = phone || !job.usb;
  $("done-text").hidden = !phone && job.usb;
  $("done-text").textContent = phone ? t("donePhone") : window.VaruDesktop ? t("doneApp") : t("doneComputer", { path: job.target });
}

// Inside the Android or desktop app, the app itself switches to the viewer.
const host = window.VaruAndroid ?? window.VaruDesktop;
$("open-files").hidden = !!window.VaruAndroid;
if (window.VaruAndroid) $("keep-open").dataset.t = "keepOpenPhone";
$("open-varu").addEventListener("click", () => {
  if (host) { host.openVaru(s.state?.job?.target ?? ""); return; }
  api("/api/open", { What: "varu" }).catch((err) => alert(err.message));
});
$("open-files").addEventListener("click", () => api("/api/open", { What: "files" }).catch((err) => alert(err.message)));
$("quit").addEventListener("click", async () => {
  await api("/api/quit", {}).catch(() => {});
  if (host) { host.close(); return; }
  document.querySelector("main").replaceChildren($("closed"));
  $("closed").hidden = false;
});

// ---------- state polling (also tells the installer the page is open) ----------

function showNotice(title, text, detail) {
  $("notice").hidden = false;
  $("notice-title").textContent = t(title);
  $("notice-text").textContent = t(text);
  $("notice-detail").textContent = detail ?? "";
  $("notice-detail").hidden = !detail;
  $("setup").hidden = $("stepper").hidden = $("foot").hidden = true;
}

let pollTimer = 0;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const state = await api("/api/state");
    const first = !s.state;
    s.state = state;
    $("loading").hidden = true;
    if (state.error && !state.regions?.length) {
      showNotice("offlineTitle", "offline", state.error);
    } else {
      $("notice").hidden = true;
      if (first || !s.region) {
        s.computerPath = state.computer;
        chooseRegion(state.regions[0].id);
        if (first && state.update && !state.job) prefill(state.update);
        $("setup").hidden = $("stepper").hidden = $("foot").hidden = !!state.job;
        renderAll(); replan();
      } else {
        renderTargets(false);
      }
    }
    renderJob(state.job);
  } catch (err) {
    $("loading").hidden = true;
    // A network error here means the installer program itself is gone.
    if (err instanceof TypeError) showNotice("goneTitle", "gone");
    else showNotice("offlineTitle", "offline", err.message);
  }
  pollTimer = setTimeout(poll, s.installing ? 1000 : 5000);
}
$("retry").addEventListener("click", () => { $("notice").hidden = true; $("loading").hidden = false; poll(); });

applyLanguage();
poll();
</script>
</body>
</html>
