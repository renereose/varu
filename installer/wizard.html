<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varu installer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b5d4b' d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E">
<style>
/* Same palette as the viewer (viewer/css/app.css). */
:root {
  --bg: #f3f0e8; --surface: #fffdf8; --ink: #1b2420; --muted: #5d6963; --line: #d9d4c7;
  --accent: #0b5d4b; --accent-ink: #ffffff; --warn: #8a4b00; --bad: #b3261e; --radius: 10px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121715; --surface: #1a211e; --ink: #e9e6dd; --muted: #9aa69f; --line: #2c3632;
    --accent: #74d3b6; --accent-ink: #0d1512; --warn: #f0b060; --bad: #ff8a80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 2rem 16px 4rem; }
header { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }
.eyebrow { margin: 0; color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: .2rem 0 .4rem; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.1; }
h2 { margin: 2.2rem 0 .3rem; font-size: 1.15rem; }
/* Counters skip hidden steps, so the numbers stay 1, 2, 3 ... */
.choice.waiting { opacity: .6; }
.format { margin: .5rem 0 0 2.6rem; }
.format p { margin: 0 0 .5rem; }
.format .warn-text { color: var(--warn); }
.format .bad-text { color: var(--bad); }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.lead, .hint { color: var(--muted); margin: 0 0 .8rem; }
.hint { font-size: .9rem; }
.lang { display: flex; gap: .3rem; }
button, select, input[type=text], input[type=search] {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem;
}
button { cursor: pointer; }
button:hover:not(:disabled), button:focus-visible { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: .75rem 1.6rem; }
.lang button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select { width: 100%; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; }
.row > input { flex: 1 1 14rem; min-width: 0; }
.choices { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; gap: .5rem; }
.choice { display: flex; gap: .75rem; align-items: center; padding: .7rem .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.choice:has(input:checked) { border-color: var(--accent); }
.choice input[type=radio], .choice input[type=checkbox] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); flex: none; margin: 0; }
.choice .grow { flex: 1; min-width: 0; }
.choice .grow input[type=text] { width: 100%; margin-top: .4rem; }
.choice small, .size { color: var(--muted); }
.size { font-size: .9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.swatch { width: .8rem; height: .8rem; border-radius: 50%; flex: none; }
.radius { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
.radius button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.home { margin: .6rem 0 0; font-weight: 600; }
.results { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .3rem; }
.results button { width: 100%; text-align: left; }
.summary { margin-top: 2rem; padding: 1rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.summary p { margin: 0 0 .4rem; }
.msgs { margin: .4rem 0 1rem; padding-left: 1.2rem; }
.msgs.bad { color: var(--bad); }
.msgs.warn { color: var(--warn); }
.notice { padding: .8rem 1rem; border-radius: var(--radius); border: 1px solid var(--bad); color: var(--bad); }
progress { width: 100%; height: 1rem; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.2rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">Varu</p>
      <h1 data-t="title"></h1>
      <p class="lead" id="lead" data-t="lead"></p>
    </div>
    <div class="lang">
      <button type="button" data-lang="et">ET</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden>
    <p id="notice-text"></p>
    <button type="button" id="retry" data-t="retry"></button>
  </div>
  <p id="loading" class="hint" data-t="loading"></p>

  <section id="setup" hidden>
    <p class="eyebrow" id="step-count"></p>

    <div class="step" data-step="1">
    <h2 data-t="whereTitle"></h2>
    <p class="hint" id="where-hint" data-t="whereHint"></p>
    <ul id="targets" class="choices" role="radiogroup"></ul>
    </div>

    <div class="step" data-step="2">
    <h2 data-t="country"></h2>
    <select id="region" aria-labelledby="region-label"></select>

    <h2 data-t="homeTitle"></h2>
    <p class="hint" data-t="homeHint"></p>
    <form id="search" class="row">
      <input type="search" id="query" autocomplete="off" data-ph="searchPh">
      <button type="submit" data-t="find"></button>
      <button type="button" id="locate" data-t="locate"></button>
    </form>
    <ul id="results" class="results"></ul>
    <p id="home" class="home" hidden></p>
    <div class="radius" id="radius" role="group"></div>
    <p class="hint" id="radius-hint"></p>
    </div>

    <div class="step" data-step="3">
    <h2 data-t="placesTitle"></h2>
    <p class="hint" data-t="placesHint"></p>
    <ul id="pois" class="choices"></ul>

    <h2 data-t="libraryTitle"></h2>
    <p class="hint" data-t="libraryHint"></p>
    <ul id="library" class="choices"></ul>
    </div>

    <div class="step" data-step="4">
    <h2 data-t="reviewTitle"></h2>
    <div class="summary" aria-live="polite">
      <p id="recap"></p>
      <p id="sizes"></p>
      <ul id="problems" class="msgs bad"></ul>
      <ul id="warnings" class="msgs warn"></ul>
      <button type="button" class="primary" id="install" data-t="install" disabled></button>
    </div>
    </div>

    <div class="actions">
      <button type="button" id="back" data-t="back"></button>
      <button type="button" class="primary" id="next" data-t="next"></button>
    </div>
  </section>

  <section id="progress" hidden aria-live="polite">
    <h2 data-t="installing"></h2>
    <progress id="bar" max="1" value="0"></progress>
    <p id="current"></p>
    <p class="hint" data-t="keepOpen"></p>
  </section>

  <section id="done" hidden>
    <h2 id="done-title"></h2>
    <ul id="errors" class="msgs bad"></ul>
    <p id="done-text"></p>
    <div class="actions">
      <button type="button" class="primary" id="open-varu" data-t="openVaru"></button>
      <button type="button" id="open-files" data-t="openFiles"></button>
      <button type="button" id="quit" data-t="quit"></button>
    </div>
  </section>

  <p id="closed" class="hint" data-t="closed" hidden></p>
</main>

    doneComputer: "Käivita Varu igal ajal Start-failiga kaustas {path}.",
    retryLater: "Uuesti proovimiseks käivita paigaldaja veel kord. Valmis osad jäävad alles.",

    openFiles: "Näita faile",

    closed: "Paigaldaja on suletud. Võid selle vahelehe sulgeda.",

    p_fat32: "„{detail}” on suurem kui 4 GB ja FAT32-vormingus pulgale see ei mahu. Vorminda pulk exFAT-vormingusse või jäta see välja.",

    p_portable: "See pulk on vormingus {detail}, mida kõik arvutid ei loe. Vorminda see 1. sammus kõigile arvutitele sobivaks.",
    notPortable: "{fs}: kõik arvutid seda pulka ei loe.",
    formatButton: "Kustuta ja vorminda kõigile arvutitele sobivaks",
    formatConfirm: "Kõik andmed pulgal {name} ({size}) kustutatakse. Seejärel vormindatakse see exFAT-vormingusse, mida loevad Windows, macOS ja Linux. Arvuti võib küsida luba.",
    formatYes: "Kustuta ja vorminda",
    cancel: "Loobu",
    formatting: "Vormindan… Ära pulka eemalda.",

    formatFailed: "Pulka ei õnnestunud vormindada: {error}",
    w_outside: "Sinu kodu on selle riigi kaardist väljas.",
  },
};
const RADII = [10, 25, 50, 100, 0];
const token = location.hash.slice(1);
const $ = (id) => document.getElementById(id);

let lang = (() => {
  try { const saved = localStorage.getItem("varu.lang"); if (saved in STRINGS) return saved; } catch {}
  return (navigator.language || "").toLowerCase().startsWith("et") ? "et" : "en";
})();
const s = {
  state: null, region: null, home: null, radius: 50,
  pois: new Set(), library: new Set(), target: null, computerPath: "",
  plan: null, planning: false, volumesKey: "", installing: false, step: 1,
};

function t(key, vars = {}) {
  const text = STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
}
function pick(labels) { return labels?.[lang] ?? labels?.en ?? Object.values(labels ?? {})[0] ?? ""; }
function size(bytes) {
  if (!bytes) return "0 MB";
  const units = ["B", "kB", "MB", "GB", "TB"];
  let i = 0;
  while (bytes >= 1000 && i < units.length - 1) { bytes /= 1000; i++; }
  return `${bytes.toLocaleString(lang, { maximumFractionDigits: i >= 3 ? 1 : 0 })} ${units[i]}`;
}
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c != null));
  return node;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- language ----------

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((node) => { node.textContent = t(node.dataset.t); });
  document.querySelectorAll("[data-ph]").forEach((node) => { node.placeholder = t(node.dataset.ph); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (s.state) renderAll();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("varu.lang", lang); } catch {}
  applyLanguage();
}));

// ---------- rendering ----------

function renderAll() {
  if (s.state.phone) { $("lead").dataset.t = "leadPhone"; $("where-hint").dataset.t = "wherePhone"; }
  $("lead").textContent = t($("lead").dataset.t); $("where-hint").textContent = t($("where-hint").dataset.t);
  renderRegions(); renderHome(); renderPois(); renderLibrary(); renderTargets(true); renderSummary();
}

function renderRegions() {
  const select = $("region");
  select.replaceChildren(...s.state.regions.map((r) => el("option", { value: r.id, textContent: pick(r.name), selected: r.id === s.region?.id })));
  select.disabled = s.state.regions.length < 2;
}

function chooseRegion(id) {
  s.region = s.state.regions.find((r) => r.id === id) ?? s.state.regions[0];
  s.pois = new Set((s.region.pois ?? []).map((p) => p.id)); // all places: they are small
  s.library = new Set(); // books are gigabytes each: opt in, never a surprise download
  s.home = null; s.radius = 0; // whole country until a home is chosen
  $("results").replaceChildren();
}

function renderHome() {
  $("home").hidden = !s.home;
  if (s.home) $("home").textContent = t("homeIs", { name: s.home.name });
  $("radius").replaceChildren(...RADII.map((km) => {
    const b = el("button", { type: "button", textContent: km ? t("within", { km }) : t("whole") });
    b.setAttribute("aria-pressed", String(km === s.radius));
    b.addEventListener("click", () => { s.radius = km; renderHome(); replan(); });
    return b;
  }));
  $("radius-hint").textContent = s.radius ? t("radiusHint", { km: s.radius }) : t("wholeHint");
}

function checkbox(checked, onChange) {
  const box = el("input", { type: "checkbox", checked });
  box.addEventListener("change", () => onChange(box.checked));
  return box;
}

function renderPois() {
  $("pois").replaceChildren(...(s.region.pois ?? []).map((p) => {
    const swatch = el("span", { className: "swatch" });
    swatch.style.background = p.color;
    const box = checkbox(s.pois.has(p.id), (on) => { on ? s.pois.add(p.id) : s.pois.delete(p.id); replan(); });
    return el("li", {}, el("label", { className: "choice" }, box, swatch, el("span", { className: "grow", textContent: pick(p.label) })));
  }));
}

function renderLibrary() {
  const books = s.region.library ?? [];
  $("library").replaceChildren(...books.map((b) => {
    const box = checkbox(s.library.has(b.name), (on) => { on ? s.library.add(b.name) : s.library.delete(b.name); replan(); });
    return el("li", {}, el("label", { className: "choice" }, box,
      el("span", { className: "grow", textContent: b.title }), el("span", { className: "size", textContent: b.size ? size(b.size) : "" })));
  }));
  $("library").hidden = $("library").previousElementSibling.hidden =
    $("library").previousElementSibling.previousElementSibling.hidden = books.length === 0;
}

function renderTargets(force) {
  if (s.formatting) return;
  const volumes = s.state.volumes;
  const key = JSON.stringify(volumes.map((v) => [v.path, v.free]));
  if (!force && key === s.volumesKey) return;
  s.volumesKey = key;
  // Nothing is chosen for the user; a stick that is pulled out is no longer chosen.
  if (s.target && s.target !== "computer" && !volumes.some((v) => v.path === s.target)) { s.target = null; replan(); }

  const radio = (value) => {
    const input = el("input", { type: "radio", name: "target", value, checked: s.target === value });
    input.addEventListener("change", () => { s.target = value; replan(); });
    return input;
  };
  const items = volumes.map((v) => el("li", {}, el("label", { className: "choice" }, radio(v.path),
    el("span", { className: "grow" }, el("strong", { textContent: v.label }), " ", el("small", { textContent: v.fs })),
    el("span", { className: "size", textContent: t("free", { free: size(v.free) }) })), formatBox(v)));

  if (!s.state.computer) { $("targets").replaceChildren(...items); return; }
  // On a computer, a stick is always one of the two choices, even before it is plugged in.
  if (!volumes.length) {
    items.push(el("li", {}, el("label", { className: "choice waiting" }, el("input", { type: "radio", name: "target", disabled: true }),
      el("span", { className: "grow" }, el("strong", { textContent: t("usbStick") }), " ", el("small", { textContent: t("noStick") })))));
  }
  const folder = el("input", { type: "text", value: s.computerPath, spellcheck: false });
  folder.setAttribute("aria-label", t("folder"));
  folder.addEventListener("input", () => { s.computerPath = folder.value; s.target = "computer"; renderTargetChecks(); replan(); });
  items.push(el("li", {}, el("label", { className: "choice" }, radio("computer"),
    el("span", { className: "grow" }, el("strong", { textContent: t("computer") }), folder))));
  $("targets").replaceChildren(...items);
}
// ---------- formatting a stick that not every computer reads ----------

const portableFS = (fs) => /^(msdos|fat|fat16|fat32|vfat|exfat)$/i.test(fs ?? "");
const notPortable = (path) => {
  const v = s.state && !s.state.phone && s.state.volumes.find((x) => x.path === path);
  return !!v && !portableFS(v.fs);
};

function formatBox(v) {
  if (s.state.phone || portableFS(v.fs)) return s.formatted === v.path ? el("p", { className: "format hint", textContent: t("formatted") }) : null;
  const box = el("div", { className: "format" });
  const ask = () => {
    const button = el("button", { type: "button", textContent: t("formatButton") });
    button.addEventListener("click", areYouSure);
    box.replaceChildren(el("p", { className: "warn-text", textContent: t("notPortable", { fs: v.fs }) }), button);
  };
  const areYouSure = () => {
    const yes = el("button", { type: "button", className: "danger", textContent: t("formatYes") });
    const no = el("button", { type: "button", textContent: t("cancel") });
    yes.addEventListener("click", run);
    no.addEventListener("click", ask);
    box.replaceChildren(el("p", { textContent: t("formatConfirm", { name: v.label, size: size(v.total) }) }), el("div", { className: "row" }, yes, no));
  };
  const run = async () => {
    s.formatting = true;
    box.replaceChildren(el("p", { textContent: t("formatting") }));
    try {
      const done = await api("/api/format", { path: v.path });
      s.formatted = s.target = done.path;
      s.state = await api("/api/state");
    } catch (err) {
      box.replaceChildren(el("p", { className: "bad-text", textContent: t("formatFailed", { error: err.message }) }));
      setTimeout(ask, 6000);
    }
    s.formatting = false;
    renderTargets(true);
    replan();
  };
  ask();
  return box;
}

function renderTargetChecks() {
  document.querySelectorAll("input[name=target]").forEach((r) => { r.checked = r.value === s.target; });
}

function targetPath() { return s.target === "computer" ? s.computerPath.trim() : s.target; }

function renderSummary() {
  const plan = s.plan;
  const problems = [], warnings = [];
  if (!targetPath()) problems.push(t("p_noTarget"));
  if (plan) {
    const vars = (p) => ({ detail: p.detail, needed: size(plan.needed), free: size(plan.free) });
    plan.problems.forEach((p) => problems.push(STRINGS.en[`p_${p.code}`] ? t(`p_${p.code}`, vars(p)) : p.detail || p.code));
    plan.warnings.forEach((p) => warnings.push(t(`w_${p.code}`, vars(p))));
  }
  const download = plan ? plan.items.reduce((sum, it) => sum + it.size - it.have, 0) : 0;
  $("sizes").textContent = s.planning ? t("calculating")
    : plan && targetPath() ? t("sizes", { download: size(download), needed: size(plan.needed), free: size(plan.free) }) : "";
  $("problems").replaceChildren(...[...new Set(problems)].map((text) => el("li", { textContent: text })));
  $("warnings").replaceChildren(...warnings.map((text) => el("li", { textContent: text })));
  $("install").disabled = s.planning || !plan || problems.length > 0 || s.installing;
  const volume = s.state.volumes.find((v) => v.path === s.target);
  $("recap").textContent = !targetPath() ? "" : t("installTo", {
    where: s.target === "computer" ? `${t("computer")} (${targetPath()})` : `${volume?.label ?? ""} (${targetPath()})`,
  });
  renderStep();
}

// ---------- steps ----------

const STEPS = 4;
function renderStep() {
  document.querySelectorAll("#setup .step").forEach((d) => { d.hidden = Number(d.dataset.step) !== s.step; });
  $("step-count").textContent = t("stepOf", { n: s.step, total: STEPS });
  $("back").hidden = s.step === 1;
  $("next").hidden = s.step === STEPS;
  // A place to put it first; a home whenever the map is cut around one.
  $("next").disabled = s.step === 1 ? !targetPath() || notPortable(s.target) || !!s.formatting : s.step === 2 && s.radius > 0 && !s.home;
}
function goStep(n) {
  s.step = Math.min(Math.max(n, 1), STEPS);
  renderStep();
  scrollTo(0, 0);
}
$("back").addEventListener("click", () => goStep(s.step - 1));
$("next").addEventListener("click", () => goStep(s.step + 1));

// ---------- planning and installing ----------

function request() {
  return {
    target: targetPath(), region: s.region.id, home: s.home, radius_km: s.radius,
    pois: [...s.pois], library: [...s.library],
  };
}

let planTimer = 0, planSeq = 0;
function replan() {
  clearTimeout(planTimer);
  s.planning = true; renderSummary();
  planTimer = setTimeout(async () => {
    const seq = ++planSeq;
    if (!targetPath()) { s.plan = null; s.planning = false; renderSummary(); return; }
    try {
      const plan = await api("/api/plan", request());
      if (seq === planSeq) s.plan = plan;
    } catch (err) {
      if (seq === planSeq) s.plan = { items: [], problems: [{ code: "", detail: err.message }], warnings: [], needed: 0, free: 0 };
    }
    if (seq === planSeq) { s.planning = false; renderSummary(); }
  }, 400);
}

$("search").addEventListener("submit", async (event) => {
  event.preventDefault();
  const q = $("query").value.trim();
  if (!q) return;
  $("results").replaceChildren(el("li", { className: "hint", textContent: "…" }));
  try {
    const found = await api(`/api/geocode?${new URLSearchParams({ q, country: s.region.country_code ?? "" })}`);
    $("results").replaceChildren(...(found.length ? found.map((place) => {
      const b = el("button", { type: "button", textContent: place.name });
      b.addEventListener("click", () => setHome(place));
      return el("li", {}, b);
    }) : [el("li", { className: "hint", textContent: t("noResults") })]));
  } catch (err) {
    $("results").replaceChildren(el("li", { className: "hint", textContent: err.message }));
  }
});

$("locate").addEventListener("click", () => {
  const say = (key) => $("results").replaceChildren(el("li", { className: "hint", textContent: t(key) }));
  if (!navigator.geolocation) { say("locateFailed"); return; }
  say("locating");
  navigator.geolocation.getCurrentPosition(
    (pos) => setHome({ lat: pos.coords.latitude, lon: pos.coords.longitude, name: t("myLocation") }),
    () => say("locateFailed"),
    { timeout: 10000, maximumAge: 600000 },
  );
});

function setHome(place) {
  s.home = { lat: place.lat, lon: place.lon, name: place.name };
  if (!s.radius) s.radius = 50;
  $("results").replaceChildren();
  renderHome(); replan();
}

$("region").addEventListener("change", () => { chooseRegion($("region").value); renderAll(); replan(); });

$("install").addEventListener("click", async () => {
  $("install").disabled = true;
  try {
    await api("/api/install", request());
    s.installing = true;
    showProgress();
  } catch (err) {
    $("problems").replaceChildren(el("li", { textContent: err.message }));
    $("install").disabled = false;
  }
});

function showProgress() {
  $("setup").hidden = true; $("progress").hidden = false;
  window.scrollTo(0, 0);
}

function renderJob(job) {
  if (!job) return;
  if (!job.finished) {
    if ($("progress").hidden) showProgress();
    s.installing = true;
    $("bar").max = job.total || 1; $("bar").value = job.done;
    const c = job.current;
    const what = !c ? "" : c.kind === "book" ? t("step_book", { title: c.title }) : t(c.cut ? "step_cut" : `step_${c.kind}`);
    $("current").textContent = `${what} – ${t("of", { done: size(job.done), total: size(job.total) })}`;
    return;
  }
  s.installing = false;
  $("setup").hidden = true; $("progress").hidden = true; $("done").hidden = false;
  const problems = job.errors.length > 0;
  $("done-title").textContent = t(problems ? "doneProblems" : "doneTitle");
  $("errors").replaceChildren(...job.errors.map((text) => el("li", { textContent: text })),
    ...(problems ? [el("li", { textContent: t("retryLater") })] : []));
  $("done-text").textContent = s.state?.phone ? t("donePhone") : job.usb ? t("doneUsb")
    : window.VaruDesktop ? t("doneApp") : t("doneComputer", { path: job.target });
}

// Inside the Android or desktop app, the app itself switches to the viewer.
const host = window.VaruAndroid ?? window.VaruDesktop;
$("open-files").hidden = !!window.VaruAndroid;
$("open-varu").addEventListener("click", () => {
  if (host) { host.openVaru(s.state?.job?.target ?? ""); return; }
  api("/api/open", { What: "varu" }).catch((err) => alert(err.message));
});
$("open-files").addEventListener("click", () => api("/api/open", { What: "files" }).catch((err) => alert(err.message)));
$("quit").addEventListener("click", async () => {
  await api("/api/quit", {}).catch(() => {});
  if (host) { host.close(); return; }
  document.querySelector("main").replaceChildren($("closed"));
  $("closed").hidden = false;
});

// ---------- state polling (also tells the installer the page is open) ----------

async function poll() {
  try {
    const state = await api("/api/state");
    const first = !s.state;
    s.state = state;
    $("loading").hidden = true;
    if (state.error && !state.regions?.length) {
      $("notice").hidden = false; $("notice-text").textContent = `${t("offline")} (${state.error})`;
    } else {
      $("notice").hidden = true;
      if (first || !s.region) {
        s.computerPath = state.computer;
        chooseRegion(state.regions[0].id);
        $("setup").hidden = !!state.job;
        renderAll(); replan();
      } else {
        renderTargets(false);
      }
    }
    renderJob(state.job);
  } catch (err) {
    $("loading").hidden = true;
    $("notice").hidden = false;
    // A network error here means the installer program itself is gone.
    $("notice-text").textContent = err instanceof TypeError ? t("gone") : err.message;
  }
  setTimeout(poll, s.installing ? 1000 : 5000);
}
$("retry").addEventListener("click", () => { $("notice").hidden = true; $("loading").hidden = false; });

applyLanguage();
poll();
</script>
</body>
</html>
