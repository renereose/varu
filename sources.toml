# Pinned upstream software and services used by the build.
# Region content (what goes on a drive) lives in regions/*.toml.

# --- JavaScript libraries vendored into the viewer -------------------------
# Tarballs come straight from the npm registry and are verified against the
# registry's own integrity hash, so the build needs neither Node nor npm.
# To upgrade: `npm view <name>@<version> dist.tarball dist.integrity`.

[[npm]]
name = "maplibre-gl"
version = "6.19.0"
license = "BSD-3-Clause"
homepage = "https://github.com/maplibre/maplibre-gl-js"
url = "https://registry.npmjs.org/maplibre-gl/-/maplibre-gl-6.19.0.tgz"
integrity = "sha512-3bOrnfddggUYudLGJFsYFvqulUyvSxy4iQzd/uURI7ZhgYEZifdSrECujRSghaCpc+v/ZsFI0Y6ZsGSilEtE+w=="
license_file = "package/LICENSE.txt"
[npm.files]
"package/dist/maplibre-gl.mjs" = "maplibre-gl.mjs"
"package/dist/maplibre-gl-worker.mjs" = "maplibre-gl-worker.mjs"
"package/dist/maplibre-gl-shared.mjs" = "maplibre-gl-shared.mjs"
"package/dist/maplibre-gl.css" = "maplibre-gl.css"

[[npm]]
name = "pmtiles"
version = "4.5.0"
license = "BSD-3-Clause"
homepage = "https://github.com/protomaps/PMTiles"
url = "https://registry.npmjs.org/pmtiles/-/pmtiles-4.5.0.tgz"
integrity = "sha512-CBeD4SoUluFziGdy/8k7FOjQxQy486n+929W/tWophauvMICpkZ26vGBWhDt/6b1FZQWNaf4jFdT/5+q0Wii5w=="
license_url = "https://raw.githubusercontent.com/protomaps/PMTiles/main/LICENSE"
# The ESM build imports "fflate" by bare name, which a browser cannot resolve
# without a bundler; the self-contained script build (global `pmtiles`) can.
[npm.files]
"package/dist/pmtiles.js" = "pmtiles.js"

[[npm]]
name = "@protomaps/basemaps"
version = "5.7.2"
license = "BSD-3-Clause"
homepage = "https://github.com/protomaps/basemaps"
url = "https://registry.npmjs.org/@protomaps/basemaps/-/basemaps-5.7.2.tgz"
integrity = "sha512-K1Yk6bWdULulYg+R2QRVXx4NzJZan5YQhpejEG0c1/sXruJrfPIPZuakpf3jwAgVmjIRVQwAv+yRafDeN0aaUQ=="
license_url = "https://raw.githubusercontent.com/protomaps/basemaps/main/LICENSE.md"
[npm.files]
"package/dist/esm/index.js" = "basemaps.mjs"

# --- Map fonts and icons ----------------------------------------------------
# Glyphs (SIL OFL) and sprites (MIT) for the Protomaps basemap style.
[assets]
repo = "https://github.com/protomaps/basemaps-assets"
commit = "028c18f713baecad011301ff7a69acc39bcc2ae7"
paths = ["fonts", "sprites/v4"]

# --- Map tiles ---------------------------------------------------------------
# Daily planet builds; the build step cuts the region out with `pmtiles extract`.
# Builds are kept for about a week, so the newest one is looked up at run time
# unless --planet-build is given.
[protomaps]
build_url = "https://build.protomaps.com/{build}.pmtiles"
lookback_days = 10

# --- Places -------------------------------------------------------------------
[overpass]
url = "https://overpass-api.de/api/interpreter"
pause_seconds = 5

# --- Library ------------------------------------------------------------------
[kiwix_catalog]
url = "https://library.kiwix.org/catalog/v2/entries"

# kiwix-serve, the reader that the launcher starts for library/*.zim.
# 3.8.1, not 3.8.2: 3.8.2 has no Windows build. Before upgrading, check that
# every file below exists for the new version at base_url.
[kiwix_tools]
version = "3.8.1"
base_url = "https://download.kiwix.org/release/kiwix-tools"
[kiwix_tools.targets]
"linux-amd64" = "kiwix-tools_linux-x86_64-{version}.tar.gz"
"linux-arm64" = "kiwix-tools_linux-aarch64-{version}.tar.gz"
"darwin-amd64" = "kiwix-tools_macos-x86_64-{version}.tar.gz"
"darwin-arm64" = "kiwix-tools_macos-arm64-{version}.tar.gz"
"windows-amd64" = "kiwix-tools_win-x86_64-{version}.zip"

# --- Launcher -----------------------------------------------------------------
# GOOS-GOARCH pairs the launcher is cross-compiled for.
[launcher]
targets = ["windows-amd64", "darwin-amd64", "darwin-arm64", "linux-amd64", "linux-arm64"]
