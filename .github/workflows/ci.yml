name: CI

# Manual only: releases and checks run on the maintainer's Mac
# (`make test`, `sh release.sh`) to stay clear of Actions billing.
# Start it from the Actions tab if you ever want a run on GitHub.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Router tests
        working-directory: router
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=arm GOARM=6 go build ./...
      - name: Library reader tests
        working-directory: zim
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=arm GOARM=6 go build ./...
      - name: Launcher tests
        working-directory: launcher
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Launcher builds for every target
        working-directory: launcher
        run: |
          for target in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
      - name: Installer tests
        working-directory: installer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          for target in windows/amd64 darwin/amd64 darwin/arm64 linux/amd64 android/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet . && \
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
      - name: Builder tests
        run: python3 -m unittest discover -s tests
      - name: Dry run
        run: python3 -m builder --region ee --out /tmp/drive --dry-run
