<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Varu – map</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b5d4b' d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="map-page">
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="./"><span class="logo"><svg data-icon="pin"></svg></span><strong>Varu</strong><span class="region" id="region"></span></a>
      <nav class="topnav" aria-label="Varu">
        <a href="./" data-i18n="navHome">Home</a>
        <a href="map.html" aria-current="page" data-needs="map" data-i18n="navMap">Map</a>
        <a href="library/" data-needs="library" data-i18n="library">Library</a>
        <a href="ready.html" data-i18n="guideTitle">Emergency guide</a>
      </nav>
      <div class="topbar-end">
        <span class="offline-badge" data-i18n="offlineReady">Offline ready</span>
        <div class="langs" id="langs" role="group"></div>
        <div class="theme-switch" role="group" data-i18n-label="theme">
          <button type="button" data-theme-choice="system" data-i18n-label="themeSystem"><svg data-icon="monitor"></svg></button>
          <button type="button" data-theme-choice="light" data-i18n-label="themeLight"><svg data-icon="sun"></svg></button>
          <button type="button" data-theme-choice="dark" data-i18n-label="themeDark"><svg data-icon="moon"></svg></button>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle"></button>
      </div>
    </div>
  </header>
  <div class="map-area" id="map-area">
    <div id="map" role="application" aria-label="Map"></div>

    <aside class="map-panel" id="panel">
      <div class="map-find">
        <form id="search" class="map-search" role="search" hidden>
          <a class="map-back" href="./" data-i18n-label="navHome"><svg data-icon="arrow-left"></svg></a>
          <svg class="search-icon" data-icon="search"></svg>
          <input id="search-input" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
            aria-controls="search-results" aria-expanded="false">
          <svg class="search-icon-end" data-icon="search"></svg>
          <ul id="search-results" class="search-results" hidden></ul>
        </form>
        <div id="nearest-box" class="nearest-box" hidden>
          <p class="label" data-i18n="findNearest">Find nearest</p>
          <div id="nearest-chips" class="chips"></div>
        </div>
      </div>
      <section id="layers" class="layers-sheet" aria-labelledby="layers-title">
        <div class="layers-head">
          <h2 id="layers-title" class="label" data-i18n="mapLayers">Map layers</h2>
          <button type="button" class="link" id="layers-hide" hidden data-i18n="hideAll">Hide all</button>
          <button type="button" class="link" id="layers-more" aria-expanded="false" aria-controls="layer-list" hidden></button>
        </div>
        <ul id="layer-list" class="layer-list"></ul>
      </section>
    </aside>

    <section id="nav-banner" class="nav-banner" hidden aria-live="polite">
      <div id="nav-arrow" class="nav-arrow"></div>
      <div>
        <p id="nav-distance" class="nav-distance"></p>
        <p id="nav-text" class="nav-text"></p>
        <p id="nav-name" class="nav-name"></p>
      </div>
    </section>

    <section id="route-panel" class="route-panel" hidden aria-live="polite">
      <div class="route-head">
        <span id="route-icon" class="route-icon" hidden></span>
        <div class="route-title">
          <p id="route-kind" class="label"></p>
          <p id="route-name" class="route-name"></p>
        </div>
        <button type="button" id="route-clear" class="route-close" data-i18n-label="clearRoute"><svg data-icon="x"></svg></button>
      </div>
      <p id="route-summary" class="route-summary"></p>
      <div id="route-notes" class="route-notes"></div>
      <div class="route-actions">
        <div class="seg route-modes" role="group">
          <button type="button" data-mode="foot"><svg data-icon="footprints"></svg><span data-i18n="walk">Walk</span></button>
          <button type="button" data-mode="car"><svg data-icon="car"></svg><span data-i18n="drive">Drive</span></button>
        </div>
        <button type="button" id="route-start" class="btn btn-primary route-start" hidden><svg data-icon="navigation"></svg><span data-i18n="navStart">Start</span></button>
        <button type="button" id="route-end" class="btn btn-primary route-end" data-i18n="navEnd">End</button>
      </div>
      <p class="route-safety" data-i18n="routeSafety">Estimate from OpenStreetMap. Follow road signs.</p>
    </section>

    <p id="map-message" class="map-message" hidden></p>
  </div>

  <nav class="tabbar" aria-label="Varu">
    <a href="./"><svg data-icon="house"></svg><span data-i18n="navHome">Home</span></a>
    <a href="map.html" aria-current="page" data-needs="map"><svg data-icon="map"></svg><span data-i18n="navMap">Map</span></a>
    <a href="library/" data-needs="library"><svg data-icon="book-open"></svg><span data-i18n="library">Library</span></a>
    <a href="ready.html"><svg data-icon="life-buoy"></svg><span data-i18n="guideShort">Guide</span></a>
  </nav>

  <script>
    // If a script fails before the map exists, say so instead of showing a blank page.
    window.addEventListener("error", function () {
      if (window.varuMap) return;
      var note = document.getElementById("map-message");
      if (!note.textContent) note.textContent = "The map could not be loaded.";
      note.hidden = false;
    });
  </script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="js/map.js"></script>
</body>
</html>
