<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Varu – map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b5d4b' d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="map-page">
  <div id="map" role="application" aria-label="Map"></div>

  <aside class="map-panel" id="panel">
    <div class="map-panel-head">
      <a class="back" href="./" data-i18n="back">Back</a>
      <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="layer-list" data-i18n="layers">Layers</button>
    </div>
    <ul id="layer-list" class="layer-list"></ul>
  </aside>

  <p id="map-message" class="map-message" hidden></p>

  <script>
    // If a script fails before the map exists, say so instead of showing a blank page.
    window.addEventListener("error", function () {
      if (window.varuMap) return;
      var note = document.getElementById("map-message");
      if (!note.textContent) note.textContent = "The map could not be loaded.";
      note.hidden = false;
    });
  </script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="js/map.js"></script>
</body>
</html>
